name: Backend CI

on:
  pull_request:
    paths:
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: pip install ruff==0.6.9

      - name: Ruff check (serviços com lint limpo)
        run: ruff check services/catalog-service services/sales-service services/sync-service

      # Dívida técnica conhecida: auth-service e integrations-service ainda
      # possuem violações de lint. Este passo fica informativo até a limpeza
      # na Fase 2 do plano de CI/CD.
      - name: Ruff check (dívida legada - informativo)
        continue-on-error: true
        run: ruff check services/auth-service services/integrations-service

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Adicione os demais serviços aqui quando tiverem tests/ e
        # requirements-dev.txt (Fase 2 do plano de CI/CD).
        service:
          - catalog-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Instalar dependências de desenvolvimento
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        working-directory: services/${{ matrix.service }}
        run: python -m pytest
