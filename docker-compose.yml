services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksync_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "8000:8000"
    environment:
      APP_NAME: auth-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_auth
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-your-internal-service-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build:
      context: ./services/catalog-service
    ports:
      - "8001:8000"
    environment:
      APP_NAME: catalog-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_catalog
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-service:
    build:
      context: ./services/sync-service
    ports:
      - "8002:8000"
    environment:
      APP_NAME: sync-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_sync
      REDIS_URL: redis://redis:6379/0
      CATALOG_SERVICE_URL: http://catalog-service:8000
      INTEGRATIONS_SERVICE_URL: http://integrations-service:8000
      SALES_SERVICE_URL: http://sales-service:8000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-your-internal-service-secret-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  integrations-service:
    build:
      context: ./services/integrations-service
    ports:
      - "8003:8000"
    environment:
      APP_NAME: integrations-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_integrations
      REDIS_URL: redis://redis:6379/0
      MERCADO_LIVRE_APP_ID: ${MERCADO_LIVRE_APP_ID:-}
      MERCADO_LIVRE_CLIENT_SECRET: ${MERCADO_LIVRE_CLIENT_SECRET:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8003}
      ML_WEBHOOK_SECRET: ${ML_WEBHOOK_SECRET:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-your-internal-service-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sales-service:
    build:
      context: ./services/sales-service
    ports:
      - "8004:8000"
    environment:
      APP_NAME: sales-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_sales
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-your-internal-service-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: