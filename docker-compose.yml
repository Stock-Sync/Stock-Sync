services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksync_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./services/catalog-service
    ports:
      - "8001:8000"
    environment:
      APP_NAME: catalog-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_catalog
    depends_on:
      postgres:
        condition: service_healthy

  sync-service:
    build:
      context: ./services/sync-service
    ports:
      - "8002:8000"
    environment:
      APP_NAME: sync-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_sync
      REDIS_URL: redis://redis:6379/0
      CATALOG_SERVICE_URL: http://catalog-service:8000
      INTEGRATIONS_SERVICE_URL: http://integrations-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started

  integrations-service:
    build:
      context: ./services/integrations-service
    ports:
      - "8003:8000"
    environment:
      APP_NAME: integrations-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_integrations
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ML_APP_ID: ${ML_APP_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-http://localhost:5173/integrations/mercadolivre/callback}
      ML_API_BASE_URL: https://api.mercadolibre.com
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-http://localhost:5173/integrations/shopee/callback}
      SHOPEE_API_BASE_URL: https://partner.shopeemobile.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sales-service:
    build:
      context: ./services/sales-service
    ports:
      - "8004:8000"
    environment:
      APP_NAME: sales-service
      APP_VERSION: 0.1.0
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stocksync_sales
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
